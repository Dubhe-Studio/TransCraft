services:
  mysql:
    image: mysql:8.4
    container_name: transcraft-mysql
    environment:
      MYSQL_ROOT_PASSWORD: transcraft_dev
      MYSQL_DATABASE: transcraft
      MYSQL_USER: transcraft
      MYSQL_PASSWORD: transcraft_dev
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  postgres:
    image: postgres:17
    container_name: transcraft-postgres
    environment:
      POSTGRES_DB: transcraft
      POSTGRES_USER: transcraft
      POSTGRES_PASSWORD: transcraft_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: transcraft-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  mysql-data:
  postgres-data:
  redis-data:
